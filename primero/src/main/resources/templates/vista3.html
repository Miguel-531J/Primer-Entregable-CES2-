<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>vista3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .estadistica {
            color: #2c3e50;
            font-size: 16px;
        }
        h2 {
            color: #27ae60;
        }
        h3 {
            color: #c0392b;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        li {
            background-color: #f8f9fa;
            border-left: 4px solid #2980b9;
            padding: 10px;
            margin-bottom: 5px;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ccc;
        }
    </style>
</head>
<body>
<div>
    Nivel de amenaza minimo en la lista1: <span class="estadistica" th:utext="${min}"></span>
</div>
<div>
    Nivel de amenaza maximo en la lista1: <span class="estadistica" th:utext="${max}"></span>
</div>
<div>
    Nivel de amenaza promedio en la lista1: <span class="estadistica" th:utext="${promedio}"></span>
</div>
</body>
</html>
